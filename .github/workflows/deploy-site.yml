name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the site
        run: npm --prefix site test

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_4ooO0p7ptn97tzXyNglyyShr
          VERCEL_PROJECT_ID: prj_aOsLHCBgR5Xb3UBCqabzUXAAetsO
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@58.7.1 --cwd site --prod --yes --token "$VERCEL_TOKEN"
