name: Desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (macOS-only manual releases)'
        required: true
        type: choice
        default: beta
        options:
          - beta
          - stable
      version:
        description: 'Semantic version for the macOS release (for example 0.1.0-beta.1)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      ENSYNC_APPLE_ID: ${{ secrets.ENSYNC_APPLE_ID }}
      ENSYNC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.ENSYNC_APPLE_APP_SPECIFIC_PASSWORD }}
      ENSYNC_APPLE_TEAM_ID: ${{ secrets.ENSYNC_APPLE_TEAM_ID }}
      ENSYNC_WINDOWS_STORE_IDENTITY_NAME: ${{ vars.ENSYNC_WINDOWS_STORE_IDENTITY_NAME }}
      ENSYNC_WINDOWS_STORE_PUBLISHER: ${{ vars.ENSYNC_WINDOWS_STORE_PUBLISHER }}
      ENSYNC_WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.ENSYNC_WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ENSYNC_RELEASE_REPOSITORY: ${{ vars.ENSYNC_RELEASE_REPOSITORY }}
      ENSYNC_RELEASE_GITHUB_TOKEN: ${{ secrets.ENSYNC_RELEASE_TOKEN }}
      ENSYNC_SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release identity
        id: resolve
        shell: bash
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="macos-only"
            channel="${{ inputs.channel }}"
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            mode="full"
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              channel="beta"
            else
              channel="stable"
            fi
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ENSYNC_RELEASE_MODE=$mode" >> "$GITHUB_ENV"
          echo "ENSYNC_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ENSYNC_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Verify the separate binary repository is public
        env:
          GH_TOKEN: ${{ secrets.ENSYNC_RELEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$ENSYNC_RELEASE_REPOSITORY"
          test -n "$GH_TOKEN"
          visibility="$(gh api "repos/$ENSYNC_RELEASE_REPOSITORY" --jq '.visibility')"
          test "$visibility" = "public"
          echo "ENSYNC_RELEASE_REPOSITORY_VISIBILITY=$visibility" >> "$GITHUB_ENV"
      - name: Verify production signing and deployment inputs
        run: node desktop/scripts/release-preflight.mjs

  macos:
    needs: preflight
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      ENSYNC_APPLE_ID: ${{ secrets.ENSYNC_APPLE_ID }}
      ENSYNC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.ENSYNC_APPLE_APP_SPECIFIC_PASSWORD }}
      ENSYNC_APPLE_TEAM_ID: ${{ secrets.ENSYNC_APPLE_TEAM_ID }}
      ENSYNC_BUILD_CHANNEL: ${{ needs.preflight.outputs.channel }}
      ENSYNC_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      ENSYNC_SOURCE_DIRTY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Set package version
        shell: bash
        run: npm --prefix desktop version --no-git-tag-version --allow-same-version "${{ needs.preflight.outputs.version }}"
      - run: npm run test:host
      - run: npm run test:release-compatibility
      - name: Build, test, sign when configured, and attest macOS artifacts
        run: npm --prefix desktop run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ensync-macos-${{ needs.preflight.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/attestation-macos.json

  windows:
    needs: preflight
    if: needs.preflight.outputs.mode == 'full'
    runs-on: windows-2025
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      ENSYNC_WINDOWS_AZURE_PUBLISHER_NAME: ${{ secrets.ENSYNC_WINDOWS_AZURE_PUBLISHER_NAME }}
      ENSYNC_WINDOWS_AZURE_ENDPOINT: ${{ secrets.ENSYNC_WINDOWS_AZURE_ENDPOINT }}
      ENSYNC_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.ENSYNC_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
      ENSYNC_WINDOWS_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.ENSYNC_WINDOWS_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ENSYNC_BUILD_CHANNEL: ${{ needs.preflight.outputs.channel }}
      ENSYNC_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      ENSYNC_SOURCE_DIRTY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Set package version
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          npm --prefix desktop version --no-git-tag-version --allow-same-version $version
      - run: npm run test:host
      - run: npm run test:release-compatibility
      - name: Build, test, sign when configured, and attest direct Windows artifacts
        run: npm --prefix desktop run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ensync-windows-${{ needs.preflight.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/attestation-windows.json

  windows-store:
    needs: preflight
    if: needs.preflight.outputs.mode == 'full'
    runs-on: windows-2025
    env:
      ENSYNC_WINDOWS_STORE_IDENTITY_NAME: ${{ vars.ENSYNC_WINDOWS_STORE_IDENTITY_NAME }}
      ENSYNC_WINDOWS_STORE_PUBLISHER: ${{ vars.ENSYNC_WINDOWS_STORE_PUBLISHER }}
      ENSYNC_WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.ENSYNC_WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      ENSYNC_BUILD_CHANNEL: ${{ needs.preflight.outputs.channel }}
      ENSYNC_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      ENSYNC_SOURCE_DIRTY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Set package version
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          npm --prefix desktop version --no-git-tag-version --allow-same-version $version
      - run: npm run test:host
      - run: npm run test:release-compatibility
      - name: Build and attest the private Partner Center upload package
        run: npm --prefix desktop run package:win-store
      - uses: actions/upload-artifact@v4
        with:
          name: ensync-windows-store-${{ needs.preflight.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.appx
            desktop/release/attestation-windows-store.json

  publish:
    needs: [preflight, macos, windows, windows-store]
    if: always() && needs.preflight.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    env:
      ENSYNC_RELEASE_REPOSITORY: ${{ vars.ENSYNC_RELEASE_REPOSITORY }}
      ENSYNC_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
      ENSYNC_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ensync-macos-${{ needs.preflight.outputs.tag }}
          path: release-input
      - name: Download direct Windows release artifacts
        if: needs.preflight.outputs.mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: ensync-windows-${{ needs.preflight.outputs.tag }}
          path: release-input
      - name: Resolve the isolated release channel
        shell: bash
        run: |
          if [[ "${{ needs.preflight.outputs.channel }}" == "beta" ]]; then
            echo "ENSYNC_RELEASE_MANIFEST=releases-beta.json" >> "$GITHUB_ENV"
          else
            echo "ENSYNC_RELEASE_MANIFEST=releases.json" >> "$GITHUB_ENV"
          fi
      - name: Verify artifacts and generate checksums and site manifest
        run: >-
          node desktop/scripts/generate-release.mjs
          --input release-input
          --output release-assets
          --tag "${{ needs.preflight.outputs.tag }}"
          --repository "${ENSYNC_RELEASE_REPOSITORY}"
          --channel "${ENSYNC_RELEASE_CHANNEL}"
          --source-commit "${ENSYNC_SOURCE_COMMIT}"
          ${{ needs.preflight.outputs.mode == 'macos-only' && '--macos-only' || '' }}
      - name: Preserve the other channel and retain rollback metadata
        shell: bash
        run: |
          mkdir -p current-feeds
          for feed in releases.json releases-beta.json; do
            status="$(curl --silent --show-error --location --output "current-feeds/$feed" --write-out '%{http_code}' "https://ensync.vercel.app/$feed")"
            if [[ "$status" == "404" ]]; then
              cp "site/public/$feed" "current-feeds/$feed"
            elif [[ "$status" != "200" ]]; then
              echo "Could not preserve production $feed (HTTP $status)." >&2
              exit 1
            fi
          done
          if [[ "$ENSYNC_RELEASE_CHANNEL" == "beta" ]]; then
            selected_feed="releases-beta.json"
            preserved_feed="releases.json"
          else
            selected_feed="releases.json"
            preserved_feed="releases-beta.json"
          fi
          node desktop/scripts/stage-release-feed.mjs \
            --current "current-feeds/$selected_feed" \
            --candidate "release-assets/$selected_feed" \
            --output "release-assets/$selected_feed" \
            --channel "$ENSYNC_RELEASE_CHANNEL"
          cp "current-feeds/$preserved_feed" "site/public/$preserved_feed"
          cp "release-assets/$selected_feed" "site/public/$selected_feed"
          npm --prefix site test
      - name: Create or repair the verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.ENSYNC_RELEASE_TOKEN }}
        shell: bash
        run: |
          release_tag="${{ needs.preflight.outputs.tag }}"
          release_title="Ensync ${release_tag} (${ENSYNC_RELEASE_CHANNEL})"
          if [[ "${{ needs.preflight.outputs.mode }}" == "macos-only" ]]; then
            release_notes="Verified ${ENSYNC_RELEASE_CHANNEL} macOS binaries for private source revision ${ENSYNC_SOURCE_COMMIT}."
          else
            release_notes="Verified ${ENSYNC_RELEASE_CHANNEL} desktop binaries for private source revision ${ENSYNC_SOURCE_COMMIT}."
          fi
          if gh release view "$release_tag" --repo "$ENSYNC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber --repo "$ENSYNC_RELEASE_REPOSITORY"
            gh release edit "$release_tag" --repo "$ENSYNC_RELEASE_REPOSITORY" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$release_tag" release-assets/* --repo "$ENSYNC_RELEASE_REPOSITORY" --title "$release_title" --notes "$release_notes"
          fi
      - name: Publish the verified manifest to the production download and update feed
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npm --prefix site test
          npx --yes vercel@58.7.1 --cwd site --prod --yes --token "$VERCEL_TOKEN"
          NEW_URL=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1" \
            | jq -r '.deployments[0].url')
          curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"alias":"ensync.vercel.app"}' \
            "https://api.vercel.com/v2/deployments/$NEW_URL/aliases?teamId=$VERCEL_ORG_ID"
