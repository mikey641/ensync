name: Desktop CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'host/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'host/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install UI and host dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Test existing host
        run: npm run test:host
      - name: Test and smoke-check desktop runtime
        run: npm --prefix desktop run verify
      - name: Package unsigned Windows verification artifacts
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node desktop/scripts/package-native.mjs --platform windows
      - name: Attest Windows verification artifacts
        if: runner.os == 'Windows'
        run: node desktop/scripts/attest-build.mjs --platform windows
      - name: Launch packaged Windows app and verify UI and Host health
        if: runner.os == 'Windows'
        run: npm --prefix desktop run smoke:win-packaged
      - name: Upload unsigned Windows verification artifacts
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ensync-windows-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/attestation-windows.json
