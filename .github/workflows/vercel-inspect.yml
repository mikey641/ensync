name: Vercel inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Alias command help
        run: npx --yes vercel@58.7.1 alias --help --token "$VERCEL_TOKEN" 2>&1 | head -60
      - name: Alias set help
        run: npx --yes vercel@58.7.1 alias set --help --token "$VERCEL_TOKEN" 2>&1 | head -60
      - name: Newest production deployment
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=3" \
          | jq -r '.deployments[] | [.uid, .url, .ready, .created] | @tsv'
      - name: Aliases on newest deployment
        run: |
          uid=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1" \
            | jq -r '.deployments[0].uid')
          echo "uid=$uid"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$uid/aliases" \
          | jq -c .
